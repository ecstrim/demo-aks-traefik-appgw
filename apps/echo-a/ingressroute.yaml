apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: echo
  namespace: echo-a
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      # Keep `match` on one line: a newline silently drops the router.
      match: Host(`echo-a.example.com`)
      middlewares:
        - name: web-chain
      services:
        - name: echo
          port: 80
    # /api/... is sent to the same service with the /api prefix removed.
    # Longer rule wins, so this takes priority over the route above.
    - kind: Rule
      match: Host(`echo-a.example.com`) && PathPrefix(`/api`)
      middlewares:
        - name: api-chain
      services:
        - name: echo
          port: 80
