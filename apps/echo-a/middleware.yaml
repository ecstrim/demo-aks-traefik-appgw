apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit
  namespace: echo-a
spec:
  rateLimit:
    average: 10
    burst: 20
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: errors
  namespace: echo-a
spec:
  errors:
    status:
      - "500-599"
    # Demo: reuse the echo service as the error backend. Swap in a real
    # error-page service. Same namespace only (allowCrossNamespace: false).
    service:
      name: echo
      port: 80
    query: /{status}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
  namespace: echo-a
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headers
  namespace: echo-a
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: echo-a
spec:
  compress: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: retry
  namespace: echo-a
spec:
  retry:
    attempts: 3
    initialInterval: 100ms
---
# Order matters: the first middleware is the outermost.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: web-chain
  namespace: echo-a
spec:
  chain:
    middlewares:
      - name: headers
      - name: compress
      - name: retry
      - name: ratelimit
      - name: errors
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-chain
  namespace: echo-a
spec:
  chain:
    middlewares:
      - name: strip-api
      - name: web-chain
