apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: echo-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: ealen/echo-server:0.9.2
          ports:
            - containerPort: 80
          env:
            - name: PORT
              value: "80"
            # Shown in the response body so you can see which namespace answered.
            - name: ENABLE__ENVIRONMENT
              value: "true"
            - name: DEMO_NAMESPACE
              value: echo-a
            - name: DEMO_ROLE
              value: web
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: echo-a
spec:
  selector:
    app: echo
  ports:
    - port: 80
      targetPort: 80
